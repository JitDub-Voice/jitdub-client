[package]
name = "jitdub"
version = "0.1.0"
edition = "2021"
description = "JitDub — совместная озвучка аниме и фильмов (Tauri v2)"

[[bin]]
name = "jitdub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
open = "5"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
