# Релиз JitDub: при пуше в main, если в package.json новая версия (тега vX.Y.Z ещё нет),
# собирается установщик Windows, подписывается ключом обновлений и публикуется GitHub Release
# с latest.json — по нему установленные клиенты узнают об обновлении и ставят его сами.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           — содержимое ~/.tauri/jitdub-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — пароль ключа (у нашего — пустой, секрет можно не создавать)
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Новая ли версия
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Тег v$VERSION уже есть — релиз не нужен"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Новая версия v$VERSION — собираю релиз"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Что нового (коммиты с прошлого релиза)
        id: notes
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${PREV:+$PREV..HEAD}
          {
            echo "body<<EOF"
            git log $RANGE --pretty='- %s' --no-merges | head -40
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: JitDub v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
